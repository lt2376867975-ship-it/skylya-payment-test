# =====================================================================
# Skylia 服务器部署 docker-compose
#
# 约定（同目录下）：
#   ./skylia-server/   后端 JAR（由本地 A-Skylia.bat pack-server 产出）
#   ./skylia-front/    用户前端 dist
#   ./skylia-admin/    管理后台 dist
#   ./skylyatype/      Skylya 官网 H5 dist（线上根路径 /）
#   ./runtime/...      install.sh 自动生成的运行期文件（nginx / mysql 初始化 / 上传目录）
#   ./.env             配置（由 install.sh 自动生成模板，请按需填写）
#
# 不需要 build 任何镜像：后端用 eclipse-temurin:17-jre 直接挂 jar，
# 前端用 nginx:alpine 直接挂 dist。修改 jar / dist 后重启对应容器即可生效。
# =====================================================================

name: skylia

x-jvm-opts: &jvm-opts >-
  -Xms256m
  -Xmx${JVM_XMX:-512}m
  -Djava.security.egd=file:/dev/./urandom
  -Duser.timezone=Asia/Shanghai
  -Duser.home=/tmp
  -Dcsp.sentinel.log.dir=/tmp/sentinel
  -Dcsp.sentinel.log.output.type=console

x-jar-runtime: &jar-runtime
  image: eclipse-temurin:17-jre
  restart: always
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: ${SERVICE_MEMORY_LIMIT:-768m}
  networks:
    - skylia-network

services:

  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: skylia-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: skylia_user
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=1
    ports:
      # 默认只 bind 到 127.0.0.1，公网访问不到；如需远程管理 → .env 中 MYSQL_BIND=0.0.0.0
      - "${MYSQL_BIND:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./runtime/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - skylia-network
    healthcheck:
      # 必须走 TCP（-h127.0.0.1）：初始化阶段的临时 mysqld 只开 socket 不开网络，
      # mysqladmin ping 走 socket 会被它"骗过"提前判 healthy，随后初始化重启又翻 unhealthy，
      # 导致依赖服务一次起不全。TCP 连通 == 初始化完全结束。
      test: ["CMD", "mysql", "-h127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # 首次启动要执行 mysql-init 的全量建表+迁移脚本，可能超过 100s；
      # start_period 内的失败不计入 retries
      start_period: 180s

  redis:
    image: redis:7-alpine
    container_name: skylia-redis
    restart: always
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    networks:
      - skylia-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: skylia-qdrant
    restart: always
    ports:
      - "${QDRANT_BIND:-127.0.0.1}:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - skylia-network

  mongodb:
    image: mongo:7
    container_name: skylia-mongodb
    restart: always
    ports:
      - "${MONGO_BIND:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-123456}
    volumes:
      - mongo_data:/data/db
    networks:
      - skylia-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.2
    # nacos v2.3.2 仅发布 amd64 镜像；在 Apple Silicon(colima/vz) 上走 qemu 模拟运行
    platform: linux/amd64
    container_name: skylia-nacos
    restart: always
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:?NACOS_AUTH_IDENTITY_KEY is required}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE is required}
    ports:
      - "${NACOS_BIND:-127.0.0.1}:${NACOS_HOST_PORT:-8848}:8848"
      - "${NACOS_BIND:-127.0.0.1}:9848:9848"
      - "${NACOS_BIND:-127.0.0.1}:9849:9849"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - skylia-network
    healthcheck:
      # 模拟运行(amd64 on ARM)下 nacos 启动慢（1-7 分钟），Java 服务等它 healthy 再启动，
      # 避免一窝蜂 crash-loop；start_period 给足模拟启动时间
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 480s

  # ==================== 后端微服务（通用 JRE 镜像 + 挂 jar） ====================

  gateway:
    <<: *jar-runtime
    container_name: skylia-gateway
    working_dir: /app
    command: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/skylia-gateway-1.0.0-SNAPSHOT.jar"]
    environment:
      JAVA_OPTS: *jvm-opts
      SPRING_PROFILES_ACTIVE: server
      NACOS_SERVER: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:-skyliaSecretKey2024ForJwtTokenGeneration}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE: ${SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE:-true}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-skylia-admin-jwt-secret-key-must-be-at-least-256-bits-long}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-https://skylya.com,https://www.skylya.com,https://localhost}
      SKYLIA_RUNTIME_ENV: server
      SKYLIA_RUNTIME_RELEASE: ${RELEASE_TAG:-server}
    volumes:
      - ./skylia-server:/app:ro
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_HOST_PORT:-18080}:18080"
    depends_on:
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  auth:
    <<: *jar-runtime
    container_name: skylia-auth
    working_dir: /app
    command: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/skylia-auth-1.0.0-SNAPSHOT.jar"]
    environment:
      JAVA_OPTS: *jvm-opts
      SPRING_PROFILES_ACTIVE: server
      NACOS_SERVER: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: skylia_user
      MYSQL_USERNAME: ${MYSQL_SKYLIA_USER_USERNAME:?MYSQL_SKYLIA_USER_USERNAME is required}
      MYSQL_PASSWORD: ${MYSQL_SKYLIA_USER_PASSWORD:?MYSQL_SKYLIA_USER_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      WECHAT_MINI_PROGRAM_APP_ID: ${WECHAT_MINI_PROGRAM_APP_ID:-}
      WECHAT_MINI_PROGRAM_APP_SECRET: ${WECHAT_MINI_PROGRAM_APP_SECRET:-}
      WECHAT_MINI_PROGRAM_API_BASE_URL: ${WECHAT_MINI_PROGRAM_API_BASE_URL:-https://api.weixin.qq.com}
      WECHAT_MINI_PROGRAM_TIMEOUT_SECONDS: ${WECHAT_MINI_PROGRAM_TIMEOUT_SECONDS:-8}
      WECHAT_PHONE_TICKET_MINUTES: ${WECHAT_PHONE_TICKET_MINUTES:-10}
      JWT_SECRET: ${JWT_SECRET:-skyliaSecretKey2024ForJwtTokenGeneration}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE: ${SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE:-true}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_REGION_ID: ${ALIYUN_REGION_ID:-cn-hangzhou}
      ALIYUN_DM_ACCOUNT_NAME: ${ALIYUN_DM_ACCOUNT_NAME:-noreply@skyliaai.com}
      ALIYUN_DM_FROM_ALIAS: ${ALIYUN_DM_FROM_ALIAS:-Skylya}
      ALIYUN_DM_TEMPLATE_NAME: ${ALIYUN_DM_TEMPLATE_NAME:-login_code}
      ALIYUN_PNVS_SIGN_NAME: ${ALIYUN_PNVS_SIGN_NAME:-}
      ALIYUN_SMS_NOTIFICATION_ENABLED: ${ALIYUN_SMS_NOTIFICATION_ENABLED:-true}
      ALIYUN_SMS_NOTIFICATION_SIGN_NAME: ${ALIYUN_SMS_NOTIFICATION_SIGN_NAME:-北京斯凯利亚科技}
      ALIYUN_SMS_MATCH_SUCCESS_TEMPLATE_CODE: ${ALIYUN_SMS_MATCH_SUCCESS_TEMPLATE_CODE:-SMS_509470198}
      ALIYUN_SMS_APPOINTMENT_CONFIRMED_TEMPLATE_CODE: ${ALIYUN_SMS_APPOINTMENT_CONFIRMED_TEMPLATE_CODE:-SMS_509540185}
      ALIYUN_SMS_MATCH_CYCLE_TIMEOUT_TEMPLATE_CODE: ${ALIYUN_SMS_MATCH_CYCLE_TIMEOUT_TEMPLATE_CODE:-}
      ALIYUN_SMS_REGISTRATION_VERIFICATION_TEMPLATE_CODE: ${ALIYUN_SMS_REGISTRATION_VERIFICATION_TEMPLATE_CODE:-SMS_509495190}
      ALIYUN_SMS_PAID_INVITE_CODE_TEMPLATE_CODE: ${ALIYUN_SMS_PAID_INVITE_CODE_TEMPLATE_CODE:-}
      ALIYUN_SMS_RECEIPT_ENABLED: ${ALIYUN_SMS_RECEIPT_ENABLED:-false}
      ALIYUN_MNS_ENDPOINT: ${ALIYUN_MNS_ENDPOINT:-https://1943695596114318.mns.cn-hangzhou.aliyuncs.com}
      ALIYUN_SMS_REPORT_ENABLED: ${ALIYUN_SMS_REPORT_ENABLED:-false}
      ALIYUN_SMS_REPORT_QUEUE_NAME: ${ALIYUN_SMS_REPORT_QUEUE_NAME:-}
      ALIYUN_SMS_REPORT_MESSAGE_TYPE: ${ALIYUN_SMS_REPORT_MESSAGE_TYPE:-SmsReport}
      ALIYUN_PNVS_REPORT_ENABLED: ${ALIYUN_PNVS_REPORT_ENABLED:-false}
      ALIYUN_PNVS_REPORT_QUEUE_NAME: ${ALIYUN_PNVS_REPORT_QUEUE_NAME:-}
      ALIYUN_PNVS_REPORT_MESSAGE_TYPE: ${ALIYUN_PNVS_REPORT_MESSAGE_TYPE:-DypnsSmsVerifyReport}
      SKYLIA_INVITE_PURCHASE_SIMULATION_ENABLED: ${SKYLIA_INVITE_PURCHASE_SIMULATION_ENABLED:-false}
      FEIGN_SKYLIA_MATCH_URL: http://match:8085
    volumes:
      - ./skylia-server:/app:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  user:
    <<: *jar-runtime
    container_name: skylia-user
    working_dir: /app
    command: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/skylia-user-service-1.0.0-SNAPSHOT.jar"]
    environment:
      JAVA_OPTS: *jvm-opts
      SPRING_PROFILES_ACTIVE: server
      NACOS_SERVER: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: skylia_user
      MYSQL_USERNAME: ${MYSQL_SKYLIA_USER_USERNAME:?MYSQL_SKYLIA_USER_USERNAME is required}
      MYSQL_PASSWORD: ${MYSQL_SKYLIA_USER_PASSWORD:?MYSQL_SKYLIA_USER_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:-skyliaSecretKey2024ForJwtTokenGeneration}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE: ${SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE:-true}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-skylia-admin-jwt-secret-key-must-be-at-least-256-bits-long}
      SKYLIA_CONFIG_MASTER_KEY: ${SKYLIA_CONFIG_MASTER_KEY:-}
      SKYLIA_BLIND_INDEX_KEY: ${SKYLIA_BLIND_INDEX_KEY:-}
      SKYLIA_INVITE_VALID_DAYS: ${SKYLIA_INVITE_VALID_DAYS:-30}
      SKYLIA_BETA_MAX_USERS: ${SKYLIA_BETA_MAX_USERS:-150}
      FEIGN_SKYLIA_PROFILE_URL: http://profile:8083
      FEIGN_SKYLIA_MATCH_URL: http://match:8085
    volumes:
      - ./skylia-server:/app:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  profile:
    <<: *jar-runtime
    container_name: skylia-profile
    working_dir: /app
    command: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/skylia-profile-service-1.0.0-SNAPSHOT.jar"]
    environment:
      JAVA_OPTS: *jvm-opts
      SPRING_PROFILES_ACTIVE: server
      NACOS_SERVER: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: skylia_user
      MYSQL_USERNAME: ${MYSQL_SKYLIA_USER_USERNAME:?MYSQL_SKYLIA_USER_USERNAME is required}
      MYSQL_PASSWORD: ${MYSQL_SKYLIA_USER_PASSWORD:?MYSQL_SKYLIA_USER_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:-skyliaSecretKey2024ForJwtTokenGeneration}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE: ${SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE:-true}
      # 临时产品策略：上传照片即可通过人物审核；设为 true 可恢复原 AI 人脸/真人审核门禁。
      SKYLIA_PROFILE_PHOTO_HUMAN_AUDIT_ENABLED: ${SKYLIA_PROFILE_PHOTO_HUMAN_AUDIT_ENABLED:-false}
      SKYLIA_CONFIG_MASTER_KEY: ${SKYLIA_CONFIG_MASTER_KEY:-}
      SKYLIA_BLIND_INDEX_KEY: ${SKYLIA_BLIND_INDEX_KEY:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_FACE_VERIFY_ENABLED: ${ALIYUN_FACE_VERIFY_ENABLED:-true}
      ALIYUN_FACE_VERIFY_SCENE_ID: ${ALIYUN_FACE_VERIFY_SCENE_ID:-}
      ALIYUN_FACE_VERIFY_REGION_ID: ${ALIYUN_FACE_VERIFY_REGION_ID:-cn-hangzhou}
      ALIYUN_FACE_VERIFY_PRODUCT_CODE: ${ALIYUN_FACE_VERIFY_PRODUCT_CODE:-PV_FV}
      ALIYUN_FACE_VERIFY_MODEL: ${ALIYUN_FACE_VERIFY_MODEL:-MOVE_ACTION}
      ALIYUN_FACE_VERIFY_RETURN_URL: ${ALIYUN_FACE_VERIFY_RETURN_URL:-http://localhost:5173/face-verification}
      ALIYUN_FACE_VERIFY_APP_RETURN_URL: ${ALIYUN_FACE_VERIFY_APP_RETURN_URL:-}
      ALIYUN_FACE_VERIFY_CALLBACK_URL: ${ALIYUN_FACE_VERIFY_CALLBACK_URL:-}
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:-}
      TENCENT_MAP_API_BASE_URL: ${TENCENT_MAP_API_BASE_URL:-https://apis.map.qq.com}
      TENCENT_MAP_TIMEOUT_SECONDS: ${TENCENT_MAP_TIMEOUT_SECONDS:-8}
    volumes:
      - ./skylia-server:/app:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  chat:
    <<: *jar-runtime
    container_name: skylia-chat
    working_dir: /app
    command: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/skylia-chat-service-1.0.0-SNAPSHOT.jar"]
    environment:
      JAVA_OPTS: *jvm-opts
      SPRING_PROFILES_ACTIVE: server
      NACOS_SERVER: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_APP_USER:?MONGO_APP_USER is required}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      MONGO_DB: skylia_chat
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:-skyliaSecretKey2024ForJwtTokenGeneration}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE: ${SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE:-true}
      SKYLIA_WS_ALLOWED_ORIGINS: ${SKYLIA_WS_ALLOWED_ORIGINS:-https://skylya.com,https://www.skylya.com,https://admin.skylya.com,https://localhost}
      SKYLIA_CONFIG_MASTER_KEY: ${SKYLIA_CONFIG_MASTER_KEY:-}
    volumes:
      - ./skylia-server:/app:ro
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  match:
    <<: *jar-runtime
    container_name: skylia-match
    working_dir: /app
    command: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/skylia-match-service-1.0.0-SNAPSHOT.jar"]
    environment:
      JAVA_OPTS: *jvm-opts
      SPRING_PROFILES_ACTIVE: server
      NACOS_SERVER: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: skylia_match
      MYSQL_USERNAME: ${MYSQL_SKYLIA_MATCH_USERNAME:?MYSQL_SKYLIA_MATCH_USERNAME is required}
      MYSQL_PASSWORD: ${MYSQL_SKYLIA_MATCH_PASSWORD:?MYSQL_SKYLIA_MATCH_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:-skyliaSecretKey2024ForJwtTokenGeneration}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE: ${SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE:-true}
      # 与 Profile 同一开关，避免匹配前置校验仍按旧的人物审核结果拦截。
      SKYLIA_PROFILE_PHOTO_HUMAN_AUDIT_ENABLED: ${SKYLIA_PROFILE_PHOTO_HUMAN_AUDIT_ENABLED:-false}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-skylia-admin-jwt-secret-key-must-be-at-least-256-bits-long}
      FEIGN_SKYLIA_PROFILE_URL: http://profile:8083
      FEIGN_SKYLIA_USER_URL: http://user:8082
      FEIGN_SKYLIA_AUTH_URL: http://skylia-auth:8081
      FEIGN_SKYLIA_AI_URL: http://ai:8087
      FEIGN_SKYLIA_FILE_URL: http://file:8086
      WECHAT_JSAPI_ENABLED: ${WECHAT_JSAPI_ENABLED:-true}
      WECHAT_MP_APP_ID: ${WECHAT_MP_APP_ID:-}
      WECHAT_MP_APP_SECRET: ${WECHAT_MP_APP_SECRET:-}
      WECHAT_JSAPI_ALLOWED_DOMAINS: ${WECHAT_JSAPI_ALLOWED_DOMAINS:-www.skylya.com,skylya.com}
      WECHAT_JSAPI_TIMEOUT_SECONDS: ${WECHAT_JSAPI_TIMEOUT_SECONDS:-8}
      # AI 画像评估走匹配服务（ProfileEvaluatorService）。如果不传这些变量，
      # match 容器的 AiConfig.apiKey 会拿不到密钥 → 画像评估必失败。
      AI_API_KEY: ${AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      SKYLIA_AI_API_KEY: ${SKYLIA_AI_API_KEY:-}
      SKYLIA_CONFIG_MASTER_KEY: ${SKYLIA_CONFIG_MASTER_KEY:-}
      SKYLIA_BLIND_INDEX_KEY: ${SKYLIA_BLIND_INDEX_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.moonshot.cn/v1}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-kimi-k2.6}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      AI_AESTHETIC_MODEL: ${AI_AESTHETIC_MODEL:-kimi-k2.6}
      OPENROUTER_AESTHETIC_MODEL: ${OPENROUTER_AESTHETIC_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      SKYLIA_AI_RUNTIME_MODE: ${SKYLIA_AI_RUNTIME_MODE:-LEGACY}
      SKYLIA_AI_SPRING_AI_AGENT_ALLOWLIST: ${SKYLIA_AI_SPRING_AI_AGENT_ALLOWLIST:-}
      RAG_VECTOR_ENABLED: ${RAG_VECTOR_ENABLED:-false}
      RAG_VECTOR_TIMEOUT_SECONDS: ${RAG_VECTOR_TIMEOUT_SECONDS:-20}
      RAG_QDRANT_BASE_URL: ${RAG_QDRANT_BASE_URL:-http://qdrant:6333}
      RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:-}
      RAG_QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-skylia_rag_chunks}
      RAG_QDRANT_DISTANCE: ${RAG_QDRANT_DISTANCE:-Cosine}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-bailian}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-v4}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-0}
      RAG_QUERY_EMBEDDING_CACHE_ENABLED: ${RAG_QUERY_EMBEDDING_CACHE_ENABLED:-true}
      RAG_QUERY_EMBEDDING_CACHE_TTL_SECONDS: ${RAG_QUERY_EMBEDDING_CACHE_TTL_SECONDS:-3600}
      RAG_QUERY_EMBEDDING_CACHE_VERSION: ${RAG_QUERY_EMBEDDING_CACHE_VERSION:-v1}
      SKYLIA_BETA_TOOLS_ENABLED: ${SKYLIA_BETA_TOOLS_ENABLED:-false}
      SKYLIA_BETA_TOOLS_DESTRUCTIVE_ENABLED: ${SKYLIA_BETA_TOOLS_DESTRUCTIVE_ENABLED:-false}
      SKYLIA_BETA_TOOLS_RUNTIME_LOGS_ENABLED: ${SKYLIA_BETA_TOOLS_RUNTIME_LOGS_ENABLED:-false}
    volumes:
      - ./skylia-server:/app:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
      qdrant: { condition: service_started }

  file:
    <<: *jar-runtime
    container_name: skylia-file
    working_dir: /app
    command: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/skylia-file-1.0.0-SNAPSHOT.jar"]
    environment:
      JAVA_OPTS: *jvm-opts
      SPRING_PROFILES_ACTIVE: server
      NACOS_SERVER: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: skylia_file
      MYSQL_USER: ${MYSQL_SKYLIA_FILE_USERNAME:?MYSQL_SKYLIA_FILE_USERNAME is required}
      MYSQL_PASSWORD: ${MYSQL_SKYLIA_FILE_PASSWORD:?MYSQL_SKYLIA_FILE_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SKYLIA_STORAGE_TYPE: ${SKYLIA_STORAGE_TYPE:-oss}
      FILE_STORAGE_PATH: /data/uploads
      FILE_URL_PREFIX: ${FILE_URL_PREFIX:-/files}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-huhehaote.aliyuncs.com}
      OSS_REGION: ${OSS_REGION:-cn-huhehaote}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-skylya-prod-images}
      OSS_URL_PREFIX: ${OSS_URL_PREFIX:-https://cdn.skylya.com}
      JWT_SECRET: ${JWT_SECRET:-skyliaSecretKey2024ForJwtTokenGeneration}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE: ${SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE:-true}
      SKYLIA_CONFIG_MASTER_KEY: ${SKYLIA_CONFIG_MASTER_KEY:-}
      SKYLIA_BLIND_INDEX_KEY: ${SKYLIA_BLIND_INDEX_KEY:-}
    volumes:
      - ./skylia-server:/app:ro
      - ./runtime/uploads:/data/uploads
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  ai:
    <<: *jar-runtime
    container_name: skylia-ai
    working_dir: /app
    command: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/skylia-ai-1.0.0-SNAPSHOT.jar"]
    environment:
      JAVA_OPTS: *jvm-opts
      SPRING_PROFILES_ACTIVE: server
      NACOS_SERVER: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_AI_DB: skylia_ai
      MYSQL_USERNAME: ${MYSQL_SKYLIA_AI_USERNAME:?MYSQL_SKYLIA_AI_USERNAME is required}
      MYSQL_PASSWORD: ${MYSQL_SKYLIA_AI_PASSWORD:?MYSQL_SKYLIA_AI_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # 与其它微服务一致走 Nacos；OpenRouter 密钥等仍建议从宿主机 .env 注入（避免空 env 覆盖）
      SKYLIA_AI_EFFECTIVE_MODEL_MODE: ${SKYLIA_AI_EFFECTIVE_MODEL_MODE:-remote}
      SKYLIA_AI_RUNTIME_MODE: ${SKYLIA_AI_RUNTIME_MODE:-LEGACY}
      SKYLIA_AI_SPRING_AI_AGENT_ALLOWLIST: ${SKYLIA_AI_SPRING_AI_AGENT_ALLOWLIST:-}
      JWT_SECRET: ${JWT_SECRET:-skyliaSecretKey2024ForJwtTokenGeneration}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE: ${SKYLIA_SECURITY_INTERNAL_SIGNATURE_ENFORCE:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SKYLIA_AI_API_KEY: ${SKYLIA_AI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      SKYLIA_CONFIG_MASTER_KEY: ${SKYLIA_CONFIG_MASTER_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-kimi-k2.6}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.moonshot.cn/v1}
      # 开 thinking 后给够输出 token，避免思考链挤掉正文 JSON 导致截断
      AI_PROFILE_MAX_TOKENS: ${AI_PROFILE_MAX_TOKENS:-4096}
      # 思考预算上限(token)，掐思考跑飞提速；调小更快，0=不限。改完用 docker compose up -d --no-deps ai
      SKYLIA_AI_THINKING_BUDGET: ${SKYLIA_AI_THINKING_BUDGET:-256}
      SKYLIA_AI_PROFILE_AGENT_RAG_ENABLED: ${SKYLIA_AI_PROFILE_AGENT_RAG_ENABLED:-true}
      SKYLIA_AI_PROFILE_AGENT_MAX_USER_TURNS: ${SKYLIA_AI_PROFILE_AGENT_MAX_USER_TURNS:-60}
      SKYLIA_AI_PROFILE_AGENT_HOSTILE_FAIL_STREAK: ${SKYLIA_AI_PROFILE_AGENT_HOSTILE_FAIL_STREAK:-6}
      OPENROUTER_AESTHETIC_MODEL: ${OPENROUTER_AESTHETIC_MODEL:-kimi-k2.6}
      AI_AESTHETIC_MODEL: ${AI_AESTHETIC_MODEL:-kimi-k2.6}
      SKYLIA_AI_DOCKER_IMAGE_FETCH_PUBLIC_HOSTS: ${SKYLIA_AI_DOCKER_IMAGE_FETCH_PUBLIC_HOSTS:-}
      SKYLIA_AI_IMAGE_FETCH_ALLOWED_HOSTS: ${SKYLIA_AI_IMAGE_FETCH_ALLOWED_HOSTS:-}
      SKYLIA_AI_DOCKER_IMAGE_FETCH_INTERNAL_HOST: ${SKYLIA_AI_DOCKER_IMAGE_FETCH_INTERNAL_HOST:-skylia-web}
      # AI 自动从与 file 服务相同的 OSS 配置派生自有 CDN/Bucket 精确白名单。
      OSS_URL_PREFIX: ${OSS_URL_PREFIX:-https://cdn.skylya.com}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-huhehaote.aliyuncs.com}
      OSS_BUCKET: ${OSS_BUCKET:-skylya-prod-images}
      AI_AESTHETIC_ANCHOR_ENABLED: ${AI_AESTHETIC_ANCHOR_ENABLED:-true}
      AI_AESTHETIC_ANCHOR_PER_TIER: ${AI_AESTHETIC_ANCHOR_PER_TIER:-3}
      AI_AESTHETIC_ANCHOR_TTL: ${AI_AESTHETIC_ANCHOR_TTL:-300}
      AI_AESTHETIC_ANCHOR_IMAGE_DETAIL: ${AI_AESTHETIC_ANCHOR_IMAGE_DETAIL:-low}
      AI_AESTHETIC_ANCHOR_CONTEXT_CACHE_ENABLED: ${AI_AESTHETIC_ANCHOR_CONTEXT_CACHE_ENABLED:-true}
      SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED: "false"
    volumes:
      - ./skylia-server:/app:ro
    depends_on:
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  # ==================== 前端 / 管理后台（Nginx 静态托管 + 反向代理） ====================

  web:
    image: nginx:alpine
    container_name: skylia-web
    restart: always
    ports:
      - "${WEB_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./skylia-front:/usr/share/nginx/html/front:ro
      - ./skylia-admin:/usr/share/nginx/html/admin:ro
      - ./skylyatype:/usr/share/nginx/html/skylyatype:ro
      - ./skylia-type-backup:/usr/share/nginx/html/type-backup:ro
      - ./runtime/uploads:/usr/share/nginx/html/files:ro
      - ./runtime/cert:/etc/nginx/cert:ro
      - ./runtime/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    networks:
      - skylia-network

# ==================== 网络与卷 ====================

networks:
  skylia-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  nacos_data:
  qdrant_data:
